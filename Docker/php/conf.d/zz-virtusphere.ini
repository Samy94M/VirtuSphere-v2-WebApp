log_errors = On
display_errors = Off
error_log = /var/www/html/logs/php-error.log
error_reporting = E_ALL

; --- Keine Argumentwerte in Stacktraces ---------------------------------------
; Ohne diese Zeile gilt der eingebaute Standard 0, und dann rendert PHP die
; Argumente jedes Frames in getTraceAsString(). Der Fehlerhandler schreibt genau
; diesen String nach logs/error.log, auf STDERR der beiden Worker und unter
; VIRTUSPHERE_DEBUG in die Seite.
;
; Das ist keine theoretische Sorge: das entschluesselte ESXi-Passwort ist das
; vierte positionale Argument von ansible_prepare_job_artifacts()
; (lib/ansible.php), dieselbe Form in lib/ansible_inventory.php und
; ssh_execute_command() (lib/ssh.php), und diese Rahmen werfen bei GEWOEHNLICHEN
; Bedingungen (Mission fehlt, Vorlage, keine VMs). Dass heute kein Trace mit
; Klartext im Log steht, liegt allein daran, dass jede dieser Aufrufstellen in
; einem catch(Throwable) sitzt, das nur getMessage() weitergibt - eine Disziplin,
; die kein Test erzwingt. Ein einziges getTraceAsString() in einem catch bringt
; das Passwort zurueck, und logs/error.log rotiert nur groessenbasiert (der
; Maintenance-Worker, lib/log_rotation.php): eine Zeile lebt dort Wochen.
;
; Das Projekt behandelt dasselbe Geheimnis auf dem MELDUNGS-Pfad schon als
; redaktionspflichtig (connection_error_detail() ersetzt es durch ***); der
; Trace-Pfad hatte kein Gegenstueck, also widersprachen sich die beiden.
;
; Bewusst 1 (Argumentliste ganz weg) und nicht zend.exception_string_param_max_len
; = 0 (Anzahl und Typen bleiben, Zeichenketten werden leer): 1 ist der Wert, den
; php.ini-production ausliefert, also der erwartete, und Datei, Zeile und Funktion
; bleiben in jedem Fall erhalten. Beides zu setzen waere redundant.
; Gepinnt durch tests/Static/ExceptionArgsContractTest.php und
; tests/Unit/ExceptionTraceRedactionTest.php (letzterer beweist den Mechanismus,
; nicht die Datei).
zend.exception_ignore_args = 1

; Kein X-Powered-By-Header mit exakter PHP-Version an jedem Response: der
; Header hat keinen Nutzen und macht die CVE-Zuordnung von aussen trivial.
; Gepinnt durch tests/Static/VersionExposureContractTest.php.
expose_php = Off

; --- Session-Haertung -------------------------------------------------------
; Bis 2026-07 liefen diese Werte auf den PHP-Defaults. Zwei davon waren echte
; Luecken, und beide sind von aussen unsichtbar: der Code funktioniert, nur die
; Zusage stimmt nicht mehr.

; Session-Fixation. Ohne use_strict_mode akzeptiert PHP eine Session-ID, die es
; nie ausgegeben hat: ein Angreifer kann dem Opfer eine ID unterschieben und sie
; nach dessen Login weiterverwenden. Der Code wehrt sich bereits mit
; session_regenerate_id(true) beim Login (lib/auth.php), das ist die zweite
; Schicht; das hier ist die erste, und sie war aus.
session.use_strict_mode = 1

; Lebensdauer der Session-DATEI auf der Platte. Muss mindestens so gross sein wie
; die laengste Sitzung, die ein Admin im Portal einstellen kann
; (VIRTUSPHERE_SESSION_LIFETIME_MINUTES_MAX = 480 Minuten = 28800 Sekunden).
;
; Der Default 1440 (24 Minuten) war kuerzer als die *kuerzeste* zulaessige
; Einstellung mal zwei: der Garbage Collector durfte die Datei eines Operators
; wegraeumen, waehrend die Sitzung laut Portal noch stundenlang gueltig war. Weil
; der GC probabilistisch von fremden Requests ausgeloest wird, war der Rauswurf
; nicht einmal reproduzierbar - er sah aus wie ein sporadischer Fehler.
;
; Massgeblich fuer den Ablauf bleibt der Server-Zeitstempel session_expires_at
; (lib/auth.php), nicht dieser Wert; er darf die Sitzung nur nicht vorher
; loeschen. tests/Static/SessionHardeningContractTest.php pinnt die Beziehung zur
; Konstanten, weil eine .ini keine Konstante interpolieren kann.
session.gc_maxlifetime = 28800

; Cookie-Flags auch auf INI-Ebene, nicht nur ueber session_set_cookie_params():
; ein Einstiegspunkt, der die Session ohne den Portal-Bootstrap startet, faellt
; sonst auf die unsicheren Defaults zurueck. Secure setzt der Code weiter
; dynamisch (erst ueber TLS, ADR-0027), das kann eine statische .ini nicht.
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_only_cookies = 1
session.use_trans_sid = 0

; Keine Session-Inhalte im Cache eines geteilten Browsers.
session.cache_limiter = nocache

; --- Mission-Import-Uploadgrenzen ---------------------------------------------
; PHPs Compile-Default fuer beide Werte ist 2M/8M - upload_max_filesize war damit
; exakt identisch mit VIRTUSPHERE_MISSION_IMPORT_MAX_BYTES
; (lib/mission_transfer.php). PHPs Ini-Grenze griff dadurch am selben Punkt wie
; die eigene App-Pruefung, sodass deren freundlichere "Datei zu gross, max. X"-
; Meldung nie zum Zug kam: PHP verwarf den Upload vorher und die Seite meldete
; stattdessen "keine Datei ausgewaehlt".
;
; Deutlicher Puffer ueber dem App-Limit (2 MB) fuer Multipart-Overhead, weit
; unter dem nginx-Limit (client_max_body_size 100m, Docker/nginx/default.conf).
; Steigt VIRTUSPHERE_MISSION_IMPORT_MAX_BYTES je, muessen beide Werte hier
; mitwachsen - kein Script prueft diese Kollision automatisch (auch
; scripts/check-bounds-sync.php nicht: der scannt nur PHP-Konstanten gegen
; Lang-Prosa, keine Ini-Direktiven).
upload_max_filesize = 4M
post_max_size = 6M
