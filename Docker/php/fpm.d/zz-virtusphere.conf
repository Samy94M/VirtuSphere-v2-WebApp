; VirtuSphere FPM pool overrides (AP8). ping.path serves the container
; healthcheck over the real FastCGI request path, so "healthy" means FPM
; accepts and answers requests, not merely that a process exists. nginx never
; proxies it (its PHP location only matches \.php$), so the endpoint stays
; unreachable from outside the container. Response defaults to "pong".
[www]
ping.path = /fpm-ping

; Hard wall clock per request (N1a F3, user decision 2026-11-09). PHP's
; max_execution_time counts CPU time on Linux, so a request blocked on a
; socket (a directory controller that completes TLS and then stays silent,
; a hung database call) never hit it, and a few of them took the pool that
; also serves the machine API and the emergency admin. The value equals
; fastcgi_read_timeout in both nginx sources; FpmRequestTimeoutContractTest
; pins that relation. The workers are CLI processes and not affected.
request_terminate_timeout = 300s

; A request still running after this long is named in the container log
; (docker compose logs php: "executing too slow", script and URI). The target
; is the master's stderr, not a file in logs/: the master is root without
; CAP_DAC_OVERRIDE and could not create a file in the www-data owned logs/
; directory, and FPM refuses to start when the slowlog cannot be opened.
; Without CAP_SYS_PTRACE (cap_drop ALL) FPM cannot add a backtrace; the
; warning line with script and URI is the evidence.
request_slowlog_timeout = 30s
slowlog = /proc/self/fd/2

; Second line of defence after a PHP code flaw (SEC2, C-11): FPM serves the
; portal and the machine API, and neither starts a process, sends mail or
; prints its own source or configuration. The pool value applies to FPM only;
; the CLI workers in the same image keep proc_open and pcntl (measured
; 2026-11-04). FpmDisabledFunctionsContractTest derives every FPM entry point
; and its require closure and fails when one of them calls a function below.
; Not a sandbox: php.net calls disable_functions circumventable.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,mail,phpinfo,show_source,highlight_file,posix_mkfifo
