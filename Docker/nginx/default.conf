log_format virtusphere '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

# Server-Header ohne nginx-Versionsnummer (http-Kontext: gilt auch fuer den
# admin-generierten HTTPS-Block aus virtusphere-conf.d). Vollstaendig
# entfernen kann Stock-nginx den Header nicht; die Version ist der Teil, der
# die CVE-Zuordnung erlaubt. Gepinnt durch VersionExposureContractTest.
server_tokens off;

# nginx answers some requests without ever reaching PHP: the deny rules below
# (403) and a request for a PHP file that does not exist (404, answered by
# PHP-FPM itself). Those responses never pass through lib/headers.php, so they
# used to carry no security headers at all.
#
# Adding them unconditionally would be worse than the gap: nginx would append a
# second Content-Security-Policy to every PHP response, and a browser enforces
# the *intersection* of two CSP headers, so a policy without the per-request
# nonce would block the portal's own styles and scripts. nginx skips an
# add_header whose value is empty, so these maps set a header only when the
# upstream did not already send one. A PHP response therefore keeps its single,
# nonce-carrying policy, and an nginx-generated response gets a strict fallback.
map $upstream_http_content_security_policy $virtusphere_csp {
    ''      "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    default '';
}

map $upstream_http_x_content_type_options $virtusphere_nosniff {
    ''      'nosniff';
    default '';
}

map $upstream_http_referrer_policy $virtusphere_referrer {
    ''      'same-origin';
    default '';
}

# Only application-generated, content-addressed asset URLs are immutable. An
# unversioned asset and a missing asset remain revalidatable; dynamic portal
# and machine responses do not receive this header at all.
map "$uri:$arg_v" $virtusphere_asset_cache_control {
    default '';
    "~^/portal/assets/[^:]+:[0-9a-f]{64}$" 'public, max-age=31536000, immutable';
    ~^/portal/assets/ 'no-cache';
}

# http-context ownership covers both the baked HTTP server and the generated
# HTTPS server. HTML is compressible too; binary images are intentionally not
# added to gzip_types.
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_comp_level 6;
gzip_types text/css application/javascript;

# Request rate for the sign-in page only (SEC1, C-02/C-08). The key is empty for
# every other URI, and nginx does not count a request with an empty key, so the
# machine API, the pollers and every other portal page stay unlimited: MECM
# syncs and client scripts arrive in bursts from one source address and Windows
# PowerShell 5.1 treats any 5xx/429 as a hard failure. The account and IP
# throttle in lib/auth_rate_limit.php stays the brute-force guard; this limit
# only caps how fast one address can make PHP open sessions and query the
# database for the login form. 5 r/s with a burst of 20 is far above what a
# team behind one shared NAT address produces when everybody signs in at once
# (two requests each: the form and the POST). Both the HTTP block below and the
# generated HTTPS block (lib/https_config.php) use this http-context zone.
map $uri $virtusphere_login_limit_key {
    default '';
    /portal/login.php $binary_remote_addr;
}
limit_req_zone $virtusphere_login_limit_key zone=virtusphere_login:1m rate=5r/s;

# Request-body budget (B4), http context so the generated HTTPS block shares
# it. nginx reads a body before PHP sees a byte, for any client and without a
# sign-in: up to client_body_buffer_size in worker memory, the rest spooled to
# client_body_temp_path. That path is the sized tmpfs /var/cache/nginx
# (docker-compose.yml), whose pages count against the container's mem_limit.
# Both values equal the image's compiled defaults; they are named here so a
# base image that moves its temp path cannot send bodies to the read-only root
# file system or past the budget. Per body the ceiling is client_max_body_size
# in the server block, just above post_max_size, which the app's largest body
# (the 16 MiB MAC callback) sets. MissionImportUploadLimitContractTest derives
# the chain: the spool lies on that tmpfs, and the tmpfs holds five bodies at
# the ceiling, so concurrent legitimate uploads still fit.
client_body_buffer_size 16k;
client_body_temp_path /var/cache/nginx/client_temp;

# Admin-generated HTTPS server block (WP7/ADR-0012). PHP writes it to the
# shared volume; an empty glob is fine, so HTTP works with no HTTPS configured.
# This HTTP server block below lives in the image and is never generated, so a
# broken generated config can never take HTTP down.
include /etc/nginx/virtusphere-conf.d/*.conf;

server {
    listen 8080;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    charset utf-8;

    # Container-native logging: Docker owns bounded rotation for both streams.
    access_log /dev/stdout virtusphere;
    error_log stderr error;
    sendfile off;
    # Just above PHP's post_max_size (20M, Docker/php/conf.d/zz-virtusphere.ini),
    # which already caps every legitimate body: the 16 MiB MAC callback, the 2 MB
    # mission import and the 64 KiB machine reports. A body PHP would discard
    # anyway is not worth buffering: nginx spools it to the size-limited tmpfs
    # /var/cache/nginx before PHP sees a byte, without any sign-in.
    # MissionImportUploadLimitContractTest pins both the order and this ceiling.
    client_max_body_size 24m;

    # `always` so they also reach the 403/404 responses, which is the point.
    add_header Content-Security-Policy $virtusphere_csp always;
    add_header X-Content-Type-Options $virtusphere_nosniff always;
    add_header Referrer-Policy $virtusphere_referrer always;
    add_header Cache-Control $virtusphere_asset_cache_control always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Do not route a missing static file through the PHP front controller: a
    # broken registry/update must stay a visible 404.
    location ^~ /portal/assets/ {
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    # Container healthcheck target (AP8): answered by nginx itself, no PHP and
    # no disk involved, so it means "nginx is up", not "the whole chain is up".
    # health.php stays the chain-level endpoint. No version info in the reply.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Application internals must never be reachable as direct URLs. lang/ holds
    # only translation arrays (SEC3, C-09).
    location ~ ^/(lib|vendor|var|logs|tests|lang)/ { deny all; }
    location ~* /(composer\.(json|lock)|phpstan.*\.neon|.*\.(dist|lock))$ { deny all; }
    # Dot files and dot directories (.env, .git, .phpunit.result.cache, editor
    # backups) are never content. Placed before the PHP location so a script
    # inside a dot directory is not executed either; /.well-known/ stays open
    # for a later ACME client and is empty today.
    location ~ /\.(?!well-known/) { deny all; }

    # Only entry points reach PHP-FPM (SEC3, C-09): a script directly in the
    # webroot or directly in /portal/. A deeper script and a top-level file that
    # other scripts only include answer 404 without PHP. Derived, not trusted:
    # NginxPhpEntryPointContractTest finds the include files from the requires
    # in the source and replays nginx's location choice for every webroot file,
    # here and in the generated HTTPS block.
    location ~ ^/(function|mysql)\.php$ { return 404; }
    location ~ ^/(portal/)?[^/]+\.php$ {
        limit_req zone=virtusphere_login burst=20 nodelay;
        limit_req_status 429;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # httpoxy (CVE-2016-5385): a client "Proxy" header must never become
        # HTTP_PROXY for PHP. The portal makes no outbound HTTP call today.
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }
    location ~ \.php$ { return 404; }
}
