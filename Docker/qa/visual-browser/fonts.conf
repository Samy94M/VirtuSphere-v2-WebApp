<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Visual-Browser (VC1): welche Schrift Chromium fuer den Portal-Stack
  (system-ui, "Segoe UI", Roboto, Arial, Helvetica, sans-serif) waehlt.
  Ohne diese Datei liefert fontconfig im Playwright-Image fuer system-ui und
  sans-serif WenQuanYi Zen Hei, also die lateinischen Glyphen einer
  chinesischen Schrift; gemessen am 16.11.2026 ueber CSS.getPlatformFontsForNode.
  Liberation Sans ist metrisch gleich Arial und liegt damit naeher an den
  Zeilenumbruechen, die das Portal auf Windows zeigt. Die Wahl ist Teil des
  gemessenen Vertrags (renderedFonts, fontSet in runner-contract.json).
-->
<fontconfig>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
