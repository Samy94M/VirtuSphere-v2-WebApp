# QA-Wegwerf-Stack: Override ueber docker-compose.yml (Integration-Lane,
# ADR-0015-Ergaenzung / ADR-0031). Gestartet von scripts/check.ps1 als eigenes
# Compose-Projekt (-p virtusphere-qa), nie von Hand neben dem Dev-Stack unter
# demselben Projektnamen.
#
# Isolationsentscheidungen:
# - Die Datenbank liegt in einem projekt-eigenen Named Volume statt im
#   Dev-Bind-Mount: jeder Lane-Lauf beginnt mit einem frischen struktur.sql
#   und stirbt mit `--profile tools down -v`. Kein Test laeuft je auf der
#   Dev-Datenbank.
# - ssl/ und virtusphere-conf.d/ sind Named Volumes, die php und webserver
#   teilen: ein HTTPS-Zertifikats-Test im QA-Stack darf niemals die
#   nginx-Konfiguration des Dev-Stacks anfassen.
# - Code, Playbooks, LDAP-Fixture und MySQL-Init kommen aus dem Volume qa-repo,
#   nicht per Bind-Mount aus dem Arbeitsbaum (OV1, 03.11.2026; vorher "der Code-Mount
#   bleibt der Arbeitsbaum"). Auf Docker Desktop ist der Bind-Mount eine
#   9p-Freigabe des Windows-Laufwerks: alle Repo-Dateien lesen dauerte dort
#   40 bis 50 s statt 0,25 s, die Unit-Suite 884 statt 119 s, und jedes
#   archivierte errno=12 (ENOMEM bei read()) lag auf diesem Weg (KB2). Das
#   Gate qa-stack fuellt qa-repo vor dem Start ueber den Einmal-Dienst
#   qa-source mit genau dem Pruefstand (git: getrackt plus nicht ignoriert,
#   dazu der Composer-Baum Docker/WebAPI/vendor) und vergleicht jede Datei per
#   SHA-256 mit dem Checkout. Bewiesen wird damit der Stand beim Start von
#   qa-stack; eine spaetere Aenderung im Arbeitsbaum erreicht den Stack erst
#   mit einem neuen qa-stack.
# - Ports/Namen und die gesamte App-Umgebung kommen ausschliesslich aus qa.env.
# - Laufzeitdateien und App-Logs teilen keine Hostdaten mit dem Dev-Stack.
# - restart "no": ein crashender Service soll im QA-Lauf sichtbar rot sein,
#   nicht per Neustart kaschiert werden.

x-qa-runtime: &qa-runtime
  type: volume
  source: qa-app-runtime
  target: /var/www/html/var
  volume:
    nocopy: true
x-qa-logs: &qa-logs
  type: volume
  source: qa-app-logs
  target: /var/www/html/logs
  volume:
    nocopy: true
# Der Pruefstand aus qa-repo ersetzt jeden Bind-Mount aus dem Arbeitsbaum:
# Code, Playbooks, LDAP-Fixture und das MySQL-Init-Schema. Compose fuehrt
# Volumes nach dem Zielpfad zusammen. subpath verlangt, dass der Ordner im
# Volume schon existiert, deshalb fuellt qa-stack qa-repo vor jedem Start.
x-qa-code: &qa-code
  type: volume
  source: qa-repo
  target: /var/www/html
  volume:
    nocopy: true
    subpath: tree/Docker/WebAPI
x-qa-ansible: &qa-ansible
  type: volume
  source: qa-repo
  target: /var/www/ansible-src
  read_only: true
  volume:
    nocopy: true
    subpath: tree/Ansible
x-qa-ldap-fixtures: &qa-ldap-fixtures
  type: volume
  source: qa-repo
  target: /fixtures/ldap
  read_only: true
  volume:
    nocopy: true
    subpath: tree/Docker/WebAPI/tests/fixtures/ldap
x-qa-mysql-init: &qa-mysql-init
  type: volume
  source: qa-repo
  target: /docker-entrypoint-initdb.d
  read_only: true
  volume:
    nocopy: true
    subpath: tree/Docker/mysql/mysql-init
services:
  webserver:
    # Kein env_file, wie im Hauptcompose: das nginx-Image liest keinen dieser
    # Werte, und die Ports kommen aus der Host-seitigen Interpolation von qa.env
    # (--env-file), nicht aus der Container-Umgebung.
    volumes:
      # Read-only like the base file (SEC1, C-05a); these entries replace the
      # base mounts for the same targets, so they must repeat read-only.
      - <<: *qa-code
        read_only: true
      - qa-ssl:/etc/nginx/ssl:ro
      - qa-conf:/etc/nginx/virtusphere-conf.d
      - *qa-runtime
      - *qa-logs
    restart: "no"

  php:
    volumes:
      - *qa-code
      - *qa-ansible
      - qa-ssl:/etc/nginx/ssl
      - qa-conf:/etc/nginx/virtusphere-conf.d
      - *qa-runtime
      - *qa-logs
      - type: volume
        source: qa-backup-status
        target: /var/backups/virtusphere-status
        read_only: true
        volume:
          nocopy: true
    # directory_ca_file() requires the CA cache directory to belong to the
    # calling uid with mode 0700. E2E portal requests run as www-data, while a
    # diagnostic docker exec defaults to root; sharing one ordinary /tmp child
    # made the suite order-dependent. A nested tmpfs pins the FPM ownership
    # before either caller runs, and root cannot replace the mountpoint.
    tmpfs:
      - /tmp/virtusphere-directory:uid=33,gid=33,mode=0700
    restart: "no"

  deploy-worker:
    volumes:
      - *qa-code
      - *qa-ansible
      - *qa-runtime
      - *qa-logs
    restart: "no"

  maintenance-worker:
    volumes:
      - *qa-code
      - *qa-runtime
      - *qa-logs
    restart: "no"

  mysql:
    volumes:
      - qa-mysql-data:/var/lib/mysql
      - *qa-mysql-init
    restart: "no"

  # Einmal-Dienst des Gates qa-stack, nie Teil von up: leert qa-repo, kopiert
  # die Dateiliste des Runners aus dem Checkout hinein und schreibt die
  # SHA-256-Liste des Volumes zurueck, die der Runner mit dem Checkout
  # vergleicht. Ohne Netz, Checkout nur lesend; /qa-evidence haengt der Runner
  # beim run an (Laufverzeichnis mit Dateiliste und Ergebnis).
  qa-source:
    image: virtusphere-php:8.4-runtime
    pull_policy: never
    profiles: ["qa-source"]
    entrypoint: ["sh", "/qa-source/Docker/qa/qa-source-sync.sh"]
    network_mode: none
    volumes:
      - type: bind
        source: .
        target: /qa-source
        read_only: true
      - type: volume
        source: qa-repo
        target: /qa-repo
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # tar stellt als root Besitz und Modus der Quelle wieder her, und das Leeren
    # muss fremde Besitzer (Linux-Runner) loeschen koennen.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

# Hermetic LDAP-Fixture (Plan-Abschnitt 18.3, Etappe 7): eine gepinnte
# Test-LDAP-Gegenstelle fuer die Integrationslane, kein PHP-Mock. dc1/dc2
# sind echte slapd-Instanzen (Dienstkonto-Bind, Suche, objectGUID-Rohwert,
# Referral, Monitor-Bind-Zaehler); die badcert-*-Dienste und ldap-blackhole
# sind ein schlanker socat-TLS-/TCP-Stub, weil ein Zertifikatsfehler den
# Handshake beendet, bevor je ein LDAP-PDU gesendet wird. Zertifikate/CAs in
# Docker/WebAPI/tests/fixtures/ldap/ (README dort, gelesen aus qa-repo), Rollenlogik in
# Docker/ldap-fixture/entrypoint.sh. DirectoryLdapFixtureTest.php beweist
# den nativen PHP/ext-ldap-Pfad dagegen; ausserhalb der Integrationslane
# (keine dieser Hostnamen aufloesbar) skippt die Suite dynamisch.
  ldap-dc1:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: dc
      CERT_NAME: root-a
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - dc1.vs-ldap.test
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1", "-b", "", "-s", "base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  ldap-dc2:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: dc
      CERT_NAME: dc2
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - dc2.vs-ldap.test
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1", "-b", "", "-s", "base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  ldap-badcert-unknown-ca:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: tls-stub
      CERT_NAME: root-b
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - dc-unknown-ca.vs-ldap.test
    healthcheck:
      test: ["CMD", "pgrep", "-x", "socat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  ldap-badcert-expired:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: tls-stub
      CERT_NAME: expired
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - expired.vs-ldap.test
    healthcheck:
      test: ["CMD", "pgrep", "-x", "socat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  ldap-badcert-wrongname:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: tls-stub
      CERT_NAME: wrongname
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - dc-wrongname.vs-ldap.test
    healthcheck:
      test: ["CMD", "pgrep", "-x", "socat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  ldap-dc-rotated:
    # Real slapd, not a tls-stub: the CA-rotation scenario proves a genuine
    # successful bind once the new CA is trusted, not just a TLS handshake.
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: dc
      CERT_NAME: root-c
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - dc-rotated.vs-ldap.test
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1", "-b", "", "-s", "base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  # N1a: Zertifikat ohne Server-Authentication-EKU (nur clientAuth), sonst
  # gueltig, vertraut und mit passendem Namen.
  ldap-badcert-noeku:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: tls-stub
      CERT_NAME: noeku
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - dc-noeku.vs-ldap.test
    healthcheck:
      test: ["CMD", "pgrep", "-x", "socat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  # N1a A5: gueltiges, vertrautes Zertifikat, aber hoechstens TLS 1.1.
  ldap-tls-legacy:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: tls-legacy
      CERT_NAME: tls11
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - dc-tls11.vs-ldap.test
    healthcheck:
      test: ["CMD", "pgrep", "-x", "socat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  # N1a A2: TLS wird angenommen, auf LDAP kommt nie eine Antwort.
  ldap-tls-silent:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: tls-silent
      CERT_NAME: silent
    volumes:
      - *qa-ldap-fixtures
    networks:
      default:
        aliases:
          - dc-silent.vs-ldap.test
    healthcheck:
      test: ["CMD", "pgrep", "-x", "socat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  ldap-blackhole:
    build:
      context: ./Docker/ldap-fixture
    environment:
      FIXTURE_ROLE: blackhole
    networks:
      default:
        aliases:
          - dc-blackhole.vs-ldap.test
    healthcheck:
      test: ["CMD", "pgrep", "-x", "socat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

volumes:
  qa-repo:
  qa-mysql-data:
  qa-ssl:
  qa-conf:
  qa-app-runtime:
  qa-app-logs:
  qa-backup-status:
