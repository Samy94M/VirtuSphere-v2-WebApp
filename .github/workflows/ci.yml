name: CI

# Lanes des kanonischen Pruef-Runners (ADR-0031, Plan v2 AP4): CI fuehrt
# scripts/check.ps1 aus statt einer zweiten, driftfaehigen Schrittliste.
# Ein Lauf je Gate und Ereignis (QL3 A5):
#   push auf main   Integration-Lane (QA-Wegwerf-Stack, --fail-on-skipped,
#                   Playwright-Chromium; ADR-0015-Ergaenzung, ADR-0028-Revision;
#                   enthaelt alle Fast-Gates) und Windows PowerShell 5.1.
#   pull_request    Fast-Lane.
#   schedule        nur die Advisory-Gates (check.ps1 -Lane Release -Advisory):
#                   ihr Ergebnis aendert sich ohne Commit, weil sie externe
#                   Advisory- und CVE-Daten lesen. Alles andere ist am Commit
#                   schon bewiesen.
#   manuell         alle Jobs.
# Tool-Versionen kommen aus scripts/tool-lock.json (Images per Digest,
# PowerShell-Module exakt); Actions sind auf volle Commit-SHAs gepinnt.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Nightly-Advisory (UTC): neue Advisories und CVEs ohne neuen Commit.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Event im Schluessel: der Nightly-Lauf darf keinen Merge-Lauf canceln.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fast-lane:
    # Push faehrt die Integration-Lane, die alle Fast-Gates enthaelt.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Host-PHP 8.4 haelt php-lint/lang-audit schnell und versionsgleich zum
      # Runtime-Image; ohne dieses Setup wuerde der Runner das vorinstallierte
      # Runner-PHP (8.3) nutzen und 8.4-Syntax falsch rot linten.
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mysqli, sodium
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.node-version'

      # compose-config interpoliert env_file/Variablen; CI hat kein echtes .env.
      - name: .env fuer das Compose-Gate stellen
        run: cp .env.example .env

      - name: PHP-Tooling-Image bauen
        run: docker build --target tooling -t virtusphere-php:8.4-tooling Docker/php

      - name: QA-Ansible-Image bauen (Pins aus Docker/qa-ansible und Ansible/requirements.yml)
        run: docker build -f Docker/qa-ansible/Dockerfile -t virtusphere-qa-ansible:latest .

      # host-secret-cleanup laeuft ohne Netz und zieht sein Image bewusst nicht
      # nach (fehlt es, ist das Gate infrastructure_error). Digest aus der Lock.
      - name: Probe-Image fuer host-secret-cleanup ziehen (scripts/tool-lock.json)
        shell: pwsh
        run: |
          $lock = Get-Content -Raw scripts/tool-lock.json | ConvertFrom-Json
          docker pull $lock.dockerImages.hostCleanupProbe.ref
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Composer install (im Projekt-Image, vendor in den Checkout)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/Docker/WebAPI \
            -e COMPOSER_CACHE_DIR=/tmp/composer-cache -e COMPOSER_ALLOW_SUPERUSER=1 \
            virtusphere-php:8.4-tooling composer install --no-interaction --no-progress --prefer-dist

      - name: PowerShell-Module (Versionen aus scripts/tool-lock.json)
        shell: pwsh
        run: |
          $lock = Get-Content -Raw scripts/tool-lock.json | ConvertFrom-Json
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $lock.powershellModules.Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion $lock.powershellModules.PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Fast-Lane (kanonischer Runner)
        shell: pwsh
        run: ./scripts/check.ps1 -Lane Fast -Json qa-artifacts/qa-fast.json

      # Diff-bezogen statt lane-gebunden: die Lane prueft den Worktree (in CI
      # immer sauber), dieser Schritt den gepushten Commit-Bereich (ADR-0031).
      - name: CSP-Pattern-Lint (geaenderte PHP-Dateien)
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Erst-Push/leerer Vorgaenger -> auf HEAD~1 zurueckfallen.
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse --verify --quiet 'HEAD~1' || git rev-parse HEAD)"
          fi
          sh scripts/lint-csp-patterns.sh --range "$base" "${{ github.sha }}"

      - name: QA-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qa-fast-lane
          path: qa-artifacts/qa-fast.json
          retention-days: 14
          if-no-files-found: error

  # Integration-Lane (Push auf main, manuell): dedizierter QA-Wegwerf-Stack,
  # vollstaendige PHPUnit-Suite mit --fail-on-skipped, Schema-Konvergenz,
  # Health-/Exposure-Vertrag, Guard-Harness und Playwright-Chromium (E2E).
  integration-lane:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # D01 (08.09.2026): Linux ist die beschlossene Zielplattform. Der explizite
    # Distributionspin liefert die Messumgebung für den späteren, separat
    # freizugebenden Runner-/Baseline-Aktivierungswechsel.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mysqli, sodium
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.node-version'

      # Die Basis-Compose referenziert .env; der QA-Stack ueberschreibt jede
      # relevante Variable aus Docker/qa/qa.env.
      - name: .env fuer Compose stellen
        run: cp .env.example .env

      - name: PHP-Tooling-Image bauen
        run: docker build --target tooling -t virtusphere-php:8.4-tooling Docker/php

      - name: QA-Ansible-Image bauen (Pins aus Docker/qa-ansible und Ansible/requirements.yml)
        run: docker build -f Docker/qa-ansible/Dockerfile -t virtusphere-qa-ansible:latest .

      # host-secret-cleanup laeuft ohne Netz und zieht sein Image bewusst nicht
      # nach (fehlt es, ist das Gate infrastructure_error). Digest aus der Lock.
      - name: Probe-Image fuer host-secret-cleanup ziehen (scripts/tool-lock.json)
        shell: pwsh
        run: |
          $lock = Get-Content -Raw scripts/tool-lock.json | ConvertFrom-Json
          docker pull $lock.dockerImages.hostCleanupProbe.ref
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Composer install (im Projekt-Image, vendor in den Checkout)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/Docker/WebAPI \
            -e COMPOSER_CACHE_DIR=/tmp/composer-cache -e COMPOSER_ALLOW_SUPERUSER=1 \
            virtusphere-php:8.4-tooling composer install --no-interaction --no-progress --prefer-dist

      - name: PowerShell-Module (Versionen aus scripts/tool-lock.json)
        shell: pwsh
        run: |
          $lock = Get-Content -Raw scripts/tool-lock.json | ConvertFrom-Json
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $lock.powershellModules.Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion $lock.powershellModules.PSScriptAnalyzer -Scope CurrentUser -Force

      # Versionen pinnt tests/e2e/package-lock.json; der Browser landet im
      # Playwright-Cache, den das e2e-portal-Gate im Preflight erkennt.
      - name: Playwright und Chromium installieren
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Integration-Lane (kanonischer Runner)
        shell: pwsh
        run: ./scripts/check.ps1 -Lane Integration -Json qa-artifacts/qa-integration.json

      # Bei Push laeuft die Fast-Lane nicht mehr; der diff-bezogene Schritt
      # zieht deshalb hierher um und prueft den gepushten Commit-Bereich.
      - name: CSP-Pattern-Lint (geaenderte PHP-Dateien im Push)
        # Auch nach roter Lane: der Befund ist unabhaengig von ihr.
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          set -eu
          base="${{ github.event.before }}"
          # Erst-Push/leerer Vorgaenger -> auf HEAD~1 zurueckfallen.
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse --verify --quiet 'HEAD~1' || git rev-parse HEAD)"
          fi
          sh scripts/lint-csp-patterns.sh --range "$base" "${{ github.sha }}"

      - name: QA-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qa-integration-lane
          path: qa-artifacts/qa-integration.json
          retention-days: 14
          if-no-files-found: error

      # Der Ordner entsteht erst, wenn der funktionale Browserabschnitt
      # tatsaechlich begonnen hat. Ein frueher Setupfehler hat daher bewusst
      # keinen Playwright-Bericht; das Pflicht-JSON oben bleibt trotzdem hart.
      - name: Playwright-Report hochladen (nur rot und vorhanden)
        if: failure() && hashFiles('tests/e2e/playwright-report-chromium/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-chromium
          path: tests/e2e/playwright-report-chromium
          retention-days: 14
          if-no-files-found: error

      # Der Visual-Harness besitzt einen eigenen, laufbezogenen Ordner. Auch
      # dieser darf fehlen, wenn die Integration vor dem Visualteil abbrach.
      - name: Visual-Diagnosen hochladen (nur rot und vorhanden)
        if: failure() && hashFiles('qa-artifacts/visual-baselines-*/**') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: visual-baseline-diagnostics
          path: qa-artifacts/visual-baselines-*
          retention-days: 14
          if-no-files-found: error

  # Windows-PowerShell-5.1-Matrix (Plan v2 AP5, ADR-0029): dieselben nativen
  # PowerShell-Gates wie in der Fast-Lane (dort pwsh 7 auf ubuntu), aber unter
  # powershell.exe 5.1 - der Engine, auf der die Skripte beim Kunden als
  # SYSTEM laufen. Nur hier laufen auch die Registry-Testbloecke und der
  # Coverage-Ratchet (run-pester.ps1 setzt ihn nur mit Registry-Provider durch).
  windows-powershell-51:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: PowerShell-Module (Versionen aus scripts/tool-lock.json, unter 5.1)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $lock = Get-Content -Raw scripts/tool-lock.json | ConvertFrom-Json
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $lock.powershellModules.Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion $lock.powershellModules.PSScriptAnalyzer -Scope CurrentUser -Force

      - name: PowerShell-Gates unter Windows PowerShell 5.1 (kanonischer Runner)
        shell: powershell
        run: ./scripts/check.ps1 -Gate powershell-syntax,powershell-tests -Json qa-artifacts/qa-ps51.json

      - name: QA-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qa-windows-powershell-51
          path: qa-artifacts/qa-ps51.json
          retention-days: 14
          if-no-files-found: error

  # Nightly (und manuell): nur die Advisory-Gates. Die Auswahl leitet der
  # Runner aus dem Registry-Flag ab (-Advisory), der Workflow nennt kein Gate.
  # image-cve scannt die Runtime-Images, die compose hier selbst baut.
  advisory-gates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.node-version'

      # compose config (Runtime-Image-Liste) interpoliert .env.
      - name: .env fuer Compose stellen
        run: cp .env.example .env

      - name: PHP-Tooling-Image bauen (composer-audit)
        run: docker build --target tooling -t virtusphere-php:8.4-tooling Docker/php

      - name: Runtime-Images bauen (image-cve)
        run: docker compose --profile '*' build

      - name: Advisory-Gates (kanonischer Runner)
        shell: pwsh
        env:
          # Hebt das GitHub-Ratenlimit von dependency-osv; der Token geht nur
          # an api.github.com und nie in den Bericht (docs/QA.md).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check.ps1 -Lane Release -Advisory -Json qa-artifacts/qa-advisory.json

      - name: QA-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qa-advisory-gates
          path: qa-artifacts/qa-advisory.json
          retention-days: 14
          if-no-files-found: error
