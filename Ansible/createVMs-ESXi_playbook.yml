---
- name: Erstellen von VMs auf einem ESXi-Host
  hosts: localhost
  gather_facts: false
  vars_files:
    - ./serverlist.yml
    - ./accounts.yml

  tasks:
    - name: Live-Inventar fuer die VM-Identitaetspruefung lesen
      community.vmware.vmware_vm_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
      delegate_to: localhost
      register: vs_vm_identity_inventory

    # `state: present` addresses by name and would otherwise align the hardware
    # of an unrelated namesake. Absence is the create case; presence is accepted
    # only for the UUID already bound to this portal VM. Duplicate names fail too.
    - name: Vorhandene VM-Namen muessen zur gespeicherten Identitaet gehoeren
      ansible.builtin.assert:
        that:
          - >-
            (
              vs_vm_identity_inventory.virtual_machines | default([])
              | selectattr('guest_name', 'equalto', item.vm_name) | list | length
            ) == 0
            or
            (
              (item.vm_instance_uuid | default('') | trim | length > 0)
              and
              (
                vs_vm_identity_inventory.virtual_machines | default([])
                | selectattr('guest_name', 'equalto', item.vm_name) | list | length
              ) == 1
              and
              (
                item.vm_instance_uuid | lower
                in
                (
                  vs_vm_identity_inventory.virtual_machines | default([])
                  | selectattr('guest_name', 'equalto', item.vm_name)
                  | map(attribute='instance_uuid', default='') | map('lower') | list
                )
              )
            )
        fail_msg: >-
          VirtuSphere VM identity collision: {{ item.vm_name }} already exists,
          but its instance UUID is not the one stored by the portal. Use the
          explicit adoption action after verifying the VM in the ESXi Host Client.
      loop: "{{ vm_configurations }}"
      loop_control:
        label: "{{ item.vm_name }}"

    - name: VMs erstellen basierend auf der Konfigurationsdatei
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.vm_name }}"
        state: present
        folder: "/"
        guest_id: "{{ item.guest_id }}"
        datacenter: "{{ item.datacenter_name }}"
        datastore: "{{ item.datastore_name }}"
        disk: "{{ item.disks }}"
        hardware:
          memory_mb: "{{ item.memory }}"
          num_cpus: "{{ item.vcpus }}"
          hotadd_cpu: "{{ item.hotadd_cpu | default(true) }}"
          hotadd_memory: "{{ item.hotadd_memory | default(true) }}"
          version: 21
          scsi: lsilogicsas
          secure_boot: true
          boot_firmware: "efi"
          vpmc_enabled: true
        networks: "{{ item.network }}"
      delegate_to: localhost
      loop: "{{ vm_configurations }}"
      when: vm_configurations | length > 0
      register: vm_creation_results

    # Wert aus VIRTUSPHERE_CREATE_SETTLE_SECONDS, nicht als Literal: jede Pause
    # im Baum muss gegen das SSH-Idle-Budget prüfbar sein.
    - name: Warten, bis ESXi die neuen VMs registriert hat
      ansible.builtin.pause:
        seconds: "{{ CreateSettleSeconds | default(60) | int }}"
