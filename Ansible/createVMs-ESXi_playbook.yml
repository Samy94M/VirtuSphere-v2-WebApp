---
- name: Erstellen von VMs auf einem ESXi-Host
  hosts: localhost
  gather_facts: false
  vars_files:
    - ./serverlist.yml
    - ./accounts.yml

  tasks:
    - name: VMs erstellen basierend auf der Konfigurationsdatei
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.vm_name }}"
        state: present
        folder: "/"
        guest_id: "{{ item.guest_id }}"
        datacenter: "{{ item.datacenter_name }}"
        datastore: "{{ item.datastore_name }}"
        disk: "{{ item.disks }}"
        hardware:
          memory_mb: "{{ item.memory }}"
          num_cpus: "{{ item.vcpus }}"
          hotadd_cpu: "{{ item.hotadd_cpu | default(true) }}"
          hotadd_memory: "{{ item.hotadd_memory | default(true) }}"
          version: 21
          scsi: lsilogicsas
          secure_boot: true
          boot_firmware: "efi"
          vpmc_enabled: true
        networks: "{{ item.network }}"
      delegate_to: localhost
      loop: "{{ vm_configurations }}"
      when: vm_configurations | length > 0
      register: vm_creation_results

    # Wert aus VIRTUSPHERE_CREATE_SETTLE_SECONDS, nicht als Literal: jede Pause
    # im Baum muss gegen das SSH-Idle-Budget prüfbar sein.
    - name: Warten, bis ESXi die neuen VMs registriert hat
      ansible.builtin.pause:
        seconds: "{{ CreateSettleSeconds | default(60) | int }}"
