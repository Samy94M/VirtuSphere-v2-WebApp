---
# Eine Statusabfrage fuer genau eine Async-Job-ID (Etappe 14B).
#
# Kurzer Aufruf, kein Warten: `async_status` wird genau einmal gefragt. Läuft
# der Job noch, ist das Ergebnis `running` und der Worker fragt später wieder.
# Ist er terminal und erfolgreich, folgt die Live-Identitätsprüfung, denn ein
# grünes Modulergebnis ist eine Aussage über den Modulaufruf, nicht über die VM.
#
# Extra-Vars des Workers:
#   vs_portal_vm_id  die Portal-VM dieser Einheit
#   vs_async_jid     die gespeicherte Job-ID
#   vs_async_dir     absolutes Async-Verzeichnis des gebundenen Handles
#   vs_result_file   absoluter Pfad der Resultatdatei
- name: Status einer Create-Einheit abfragen
  hosts: localhost
  gather_facts: false
  vars_files:
    - ./serverlist.yml
    - ./accounts.yml
  environment:
    SSL_CERT_FILE: "{{ esxi_ca_bundle_path }}"
    REQUESTS_CA_BUNDLE: "{{ esxi_ca_bundle_path }}"

  tasks:
    - name: Genau eine Ziel-VM aufloesen
      ansible.builtin.set_fact:
        vs_targets: >-
          {{
            vm_configurations | default([])
            | selectattr('portal_vm_id', 'equalto', vs_portal_vm_id | int) | list
          }}

    - name: Die Ziel-ID muss genau einmal vorkommen
      ansible.builtin.assert:
        that:
          - vs_targets | length == 1
        fail_msg: >-
          VirtuSphere protocol error: portal_vm_id {{ vs_portal_vm_id }} matched
          {{ vs_targets | length }} entries in serverlist.yml.

    - name: Ziel-VM festlegen
      ansible.builtin.set_fact:
        vs_target: "{{ vs_targets | first }}"

    # ZUERST ein gebundener Snapshot der Statusdatei, dann die normale
    # async_status-Abfrage. async_status behandelt eine leere oder unlesbare
    # Datei als laufend und kann einen zwischenzeitlich entfernten Zustand nur
    # über freie Meldung beschreiben. Der kleine Inspector liefert dagegen
    # geschlossene Strukturwerte und bewahrt failed/changed des ursprünglichen
    # Modulresultats. Er liest genau <async_dir>/<jid>, löscht nichts und stellt
    # keine Verbindung zu ESXi her.
    - name: Statusdatei des Async-Jobs gebunden lesen
      ansible.builtin.command:
        argv:
          - python3
          - ./inspect_create_async_state.py
          - "{{ vs_async_dir }}"
          - "{{ vs_async_jid }}"
      delegate_to: localhost
      register: vs_async_snapshot_command
      changed_when: false
      failed_when: false

    - name: Fehler des lokalen Statuslesers strukturiert melden
      when: vs_async_snapshot_command.rc | int != 0
      block:
        - name: Leserfehler schreiben
          ansible.builtin.copy:
            dest: "{{ vs_result_file }}"
            mode: "0600"
            content: >-
              {{
                {
                  'event': 'rejected',
                  'portal_vm_id': vs_target.portal_vm_id | int,
                  'vm_name': vs_target.vm_name,
                  'error_code': 'protocol_error',
                  'error': 'the bound async state inspector could not run'
                } | to_nice_json
              }}
          delegate_to: localhost

        - name: Ohne Statusannahme beenden
          ansible.builtin.meta: end_play

    - name: Gebundenen Statussnapshot dekodieren
      ansible.builtin.set_fact:
        vs_async_snapshot: "{{ vs_async_snapshot_command.stdout | from_json }}"

    - name: Fehlenden oder unlesbaren Async-Zustand strukturiert melden
      when: vs_async_snapshot.state in ['missing', 'unreadable', 'invalid']
      block:
        - name: Ungeklärten Zustand schreiben
          ansible.builtin.copy:
            dest: "{{ vs_result_file }}"
            mode: "0600"
            content: >-
              {{
                {
                  'event': 'rejected',
                  'portal_vm_id': vs_target.portal_vm_id | int,
                  'vm_name': vs_target.vm_name,
                  'error_code': ('async_state_missing' if vs_async_snapshot.state == 'missing' else 'protocol_error'),
                  'error': (
                    'the async state file of this job id is gone'
                    if vs_async_snapshot.state == 'missing'
                    else (
                      'the async state file of this job id is unreadable'
                      if vs_async_snapshot.state == 'unreadable'
                      else vs_async_snapshot.reason | default('the async state file is invalid')
                    )
                  )
                } | to_nice_json
              }}
          delegate_to: localhost

        - name: Ohne Abfrage beenden
          ansible.builtin.meta: end_play

    # Genau eine normale Frage an den Async-Job. ignore_errors lässt das
    # Steuerplaybook weiterlaufen, ohne failed oder changed des ursprünglichen
    # Modulresultats umzuschreiben. Der Snapshot bleibt die unabhängige
    # strukturelle Evidenz und beide Antworten müssen zusammenpassen.
    - name: Async-Job genau einmal abfragen
      ansible.builtin.async_status:
        jid: "{{ vs_async_jid }}"
      vars:
        ansible_async_dir: "{{ vs_async_dir }}"
      register: vs_status
      ignore_errors: true

    - name: Statusdatei nach der Abfrage erneut pruefen
      ansible.builtin.stat:
        path: "{{ vs_async_dir }}/{{ vs_async_jid }}"
      delegate_to: localhost
      register: vs_async_state_after

    - name: Snapshot und Statusabfrage muessen konsistent sein
      ansible.builtin.set_fact:
        vs_async_status_consistent: >-
          {{
            (vs_async_snapshot.state == 'running')
            or (
              vs_async_snapshot.state == 'failed'
              and (vs_status.finished | default(false) | bool)
              and (vs_status.failed | default(false) | bool)
            )
            or (
              vs_async_snapshot.state == 'succeeded'
              and (vs_status.finished | default(false) | bool)
              and not (vs_status.failed | default(false) | bool)
              and (vs_status.changed is defined)
              and ((vs_status.changed | bool) == (vs_async_snapshot.changed | bool))
            )
          }}

    - name: Widerspruechliche oder entfernte Statusevidenz melden
      when: (not vs_async_state_after.stat.exists) or not (vs_async_status_consistent | bool)
      block:
        - name: Widerspruch schreiben
          ansible.builtin.copy:
            dest: "{{ vs_result_file }}"
            mode: "0600"
            content: >-
              {{
                {
                  'event': 'rejected',
                  'portal_vm_id': vs_target.portal_vm_id | int,
                  'vm_name': vs_target.vm_name,
                  'error_code': ('async_state_missing' if not vs_async_state_after.stat.exists else 'protocol_error'),
                  'error': (
                    'the async state file disappeared while its result was being checked'
                    if not vs_async_state_after.stat.exists
                    else 'the async state snapshot contradicts the async status result'
                  )
                } | to_nice_json
              }}
          delegate_to: localhost

        - name: Ohne Ergebnisannahme beenden
          ansible.builtin.meta: end_play

    - name: Noch laufend melden
      when: vs_async_snapshot.state == 'running'
      block:
        - name: Laufzustand schreiben
          ansible.builtin.copy:
            dest: "{{ vs_result_file }}"
            mode: "0600"
            content: >-
              {{
                {
                  'event': 'running',
                  'portal_vm_id': vs_target.portal_vm_id | int,
                  'async_jid': vs_async_jid | string
                } | to_nice_json
              }}
          delegate_to: localhost

        - name: Ohne weitere Abfrage beenden
          ansible.builtin.meta: end_play

    - name: Terminalen Modulfehler melden
      when: vs_async_snapshot.state == 'failed'
      block:
        # Die Ursache wird auf eine Zeile begrenzt und traegt keine
        # Modulargumente: der Marker ist eine Diagnosezeile, kein Dump.
        - name: Fehlschlag schreiben
          ansible.builtin.copy:
            dest: "{{ vs_result_file }}"
            mode: "0600"
            content: >-
              {{
                {
                  'event': 'failed',
                  'portal_vm_id': vs_target.portal_vm_id | int,
                  'async_jid': vs_async_jid | string,
                  'error': (vs_async_snapshot.error | default('the create module reported a failure'))
                           | string | replace('\n', ' ') | truncate(1024, true, '')
                } | to_nice_json
              }}
          delegate_to: localhost

        - name: Ohne Identitaetspruefung beenden
          ansible.builtin.meta: end_play

    # Erst hier: der Async-Job ist terminal und meldet Erfolg. Was das für die
    # VM heisst, entscheidet die Live-Abfrage, nicht der Modulrueckgabewert.
    # Ohne den Abgleich gegen die GESPEICHERTE Portal-UUID: die VM ist gerade
    # erst entstanden, ihre dauerhafte Identitaet ist das Ergebnis dieses Laufs.
    - name: Identitaet nach dem Erfolg pruefen
      ansible.builtin.include_tasks: ./create_identity_check_tasks.yml
      vars:
        vs_identity_require_stored_match: false

    # Ein Erfolg ohne live auffindbare, dauerhafte Identitaet ist kein Erfolg.
    # Als Marker gemeldet statt als Abbruch: der Async-Job IST terminal, und
    # diese Einheit hat damit ein Ergebnis, das der Worker speichern muss.
    - name: Erfolg ohne verwertbare Identitaet melden
      when: >-
        (vs_identity_conflict | bool)
        or not (vs_existed_before | bool)
        or (vs_precheck_moid | length) == 0
        or (vs_precheck_instance_uuid | length) == 0
      block:
        - name: Unbrauchbares Identitaetsergebnis schreiben
          ansible.builtin.copy:
            dest: "{{ vs_result_file }}"
            mode: "0600"
            content: >-
              {{
                {
                  'event': 'rejected',
                  'portal_vm_id': vs_target.portal_vm_id | int,
                  'vm_name': vs_target.vm_name,
                  'error_code': 'identity_result_invalid',
                  'error': 'the async job succeeded, but the live inventory shows no single VM with a durable identity'
                } | to_nice_json
              }}
          delegate_to: localhost

        - name: Ohne Erfolgsmeldung beenden
          ansible.builtin.meta: end_play

    - name: Aktuellen Energiezustand der Ziel-VM lesen
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ esxi_validate_certs | bool }}"
        datacenter: "{{ vs_target.datacenter_name }}"
        moid: "{{ vs_precheck_moid }}"
      delegate_to: localhost
      register: vs_guest

    - name: Erfolg mit verifizierter Identitaet schreiben
      ansible.builtin.copy:
        dest: "{{ vs_result_file }}"
        mode: "0600"
        content: >-
          {{
            {
              'event': 'succeeded',
              'portal_vm_id': vs_target.portal_vm_id | int,
              'vm_name': vs_target.vm_name,
              'async_jid': vs_async_jid | string,
              'changed': vs_async_snapshot.changed | bool,
              'moid': vs_precheck_moid,
              'instance_uuid': vs_precheck_instance_uuid,
              'power_state': vs_guest.instance.hw_power_status | default('unknown')
            } | to_nice_json
          }}
      delegate_to: localhost
