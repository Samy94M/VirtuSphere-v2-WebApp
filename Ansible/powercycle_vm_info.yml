---
- name: Beginn der Powercycle-Statusabfrage melden
  ansible.builtin.debug:
    msg: "[{{ powercycle_info_index + 1 }}/{{ powercycle_targets | length }}] RUN Powercycle info {{ powercycle_target['vm_name'] }}"

- name: Powercycle-Marker fuer genau diese VM bestaetigen lassen
  block:
    - name: ESXi-Zugriffsversuch vor der ersten VM-Abfrage journalisieren
      ansible.builtin.command:
        argv:
          - python3
          - ./report_vm_touch.py
          - --vm-id
          - "{{ powercycle_target['portal_vm_id'] | string }}"
          - --phase
          - powercycle
          - --attempt
          - "{{ job_execution['attempt'] | string }}"
          - --generation
          - "{{ job_execution['generation'] }}"
      register: powercycle_touch
      changed_when: false
  rescue:
    - name: Abgelehnten Powercycle-Marker als geschlossene Ursache melden
      ansible.builtin.debug:
        msg: "[{{ powercycle_info_index + 1 }}/{{ powercycle_targets | length }}] fail Powercycle info {{ powercycle_target['vm_name'] }}: touch_refused"

    - name: Keine ESXi-Abfrage ohne Markerbestaetigung starten
      ansible.builtin.fail:
        msg: >-
          Powercycle access marker was refused for portal VM
          {{ powercycle_target['portal_vm_id'] }}; no ESXi query was started.

# AN-01: addressed by the bound instance UUID, never by the name. The identity
# assertion in powercycleVMs-ESXi_playbook.yml still checks both. A failed read
# is repeated up to three times (W1); every repetition is a RETRY line.
- name: Ausgangszustand dieser VM erfassen
  ansible.builtin.include_tasks: ./esxi_vm_read_tasks.yml
  vars:
    vs_read_uuid: "{{ powercycle_target['vm_instance_uuid'] }}"
    vs_read_datacenter: "{{ powercycle_target['datacenter_name'] }}"
    vs_read_position: "[{{ powercycle_info_index + 1 }}/{{ powercycle_targets | length }}]"
    vs_read_unit: "Powercycle info {{ powercycle_target['vm_name'] }}"

- name: Ergebnis der Statusabfrage dieser VM festhalten
  ansible.builtin.set_fact:
    powercycle_current_info: "{{ vs_vm_read }}"

- name: Loop-Ergebnisform der Statusabfrage erhalten
  ansible.builtin.set_fact:
    powercycle_initial:
      results: "{{ powercycle_initial.results + [powercycle_current_info | combine({'item': powercycle_target})] }}"

- name: Statusabfrageergebnis dieser VM melden
  ansible.builtin.debug:
    msg: "[{{ powercycle_info_index + 1 }}/{{ powercycle_targets | length }}]
      {{ 'fail' if powercycle_current_info['failed'] | default(false) | bool else 'pass' }}
      Powercycle info {{ powercycle_target['vm_name'] }}"

# Auch der letzte Versuch ist fehlgeschlagen. Der Lauf endet hier: ohne diesen
# Abbruch wuerde die naechste VM noch beim Portal als angefasst gemeldet und
# abgefragt, und erst das Identitaets-Assert brache mit einer falschen Ursache
# ab. Die Meldung des Moduls steht im Text und wird so die Ursache im Portal.
- name: Fehlgeschlagene Statusabfrage vor der naechsten VM abbrechen
  ansible.builtin.fail:
    msg: >-
      vmware_guest_info failed for {{ powercycle_target['vm_name'] }}
      after {{ vs_read_attempt }} attempt(s):
      {{ powercycle_current_info['msg'] | default('no module message') }}
  when: powercycle_current_info['failed'] | default(false) | bool
