- name: Beginn der Export-Statusabfrage melden
  ansible.builtin.debug:
    msg: "[{{ export_info_index + 1 }}/{{ vm_configurations | length }}] RUN Export info {{ export_vm_config['vm_name'] }}"

- name: Export-Marker fuer genau diese VM bestaetigen lassen
  block:
    - name: ESXi-Zugriffsversuch vor der ersten VM-Abfrage journalisieren
      ansible.builtin.command:
        argv:
          - python3
          - ./report_vm_touch.py
          - --vm-id
          - "{{ export_vm_config['portal_vm_id'] | string }}"
          - --phase
          - export
          - --attempt
          - "{{ job_execution['attempt'] | string }}"
          - --generation
          - "{{ job_execution['generation'] }}"
      register: export_touch
      changed_when: false
  rescue:
    - name: Abgelehnten Export-Marker als geschlossene Ursache melden
      ansible.builtin.debug:
        msg: "[{{ export_info_index + 1 }}/{{ vm_configurations | length }}] fail Export info {{ export_vm_config['vm_name'] }}: touch_refused"

    - name: Keine Exportabfrage ohne Markerbestaetigung starten
      ansible.builtin.fail:
        msg: >-
          Export access marker was refused for portal VM
          {{ export_vm_config['portal_vm_id'] }}; no ESXi query was started.
          Results already read in this run were NOT uploaded: start the export again.

# AN-01: the bound instance UUID addresses the VM, as every mutation of this run
# does. The identity check below still compares the name as well. A failed read
# is repeated up to three times (W1); only the last result counts. It stays a
# per-VM callback result: a touch refusal above is a hard playbook stop and
# never reaches this query, a query failure is `esxi_query_failed` for this VM.
- name: Informationen dieser VM abfragen
  ansible.builtin.include_tasks: ./esxi_vm_read_tasks.yml
  vars:
    vs_read_uuid: "{{ export_vm_config['vm_instance_uuid'] }}"
    vs_read_datacenter: "{{ export_vm_config['datacenter_name'] }}"
    vs_read_position: "[{{ export_info_index + 1 }}/{{ vm_configurations | length }}]"
    vs_read_unit: "Export info {{ export_vm_config['vm_name'] }}"

- name: Ergebnis der Exportabfrage dieser VM festhalten
  ansible.builtin.set_fact:
    vm_info_current: "{{ vs_vm_read }}"

- name: Loop-Ergebnisform der Exportabfrage erhalten
  ansible.builtin.set_fact:
    vm_info:
      results: "{{ vm_info.results + [vm_info_current | combine({'item': export_vm_config})] }}"

- name: Name und Instance-UUID des Exportergebnisses validieren
  ansible.builtin.set_fact:
    vm_info_identity_results: >-
      {{
        vm_info_identity_results
        +
        [
          vm_info_current | combine({'item': export_vm_config})
          if
          (
            vm_info_current['failed'] | default(false) | bool
            or
            (
              ((vm_info_current['instance'] | default({}))['hw_name'] | default(''))
              == (export_vm_config['vm_name'] | default(''))
              and
              (
                (
                  (export_vm_config['vm_instance_uuid'] | default('')) | trim | length > 0
                  and
                  ((vm_info_current['instance'] | default({}))['instance_uuid'] | default('')) | lower
                  == (export_vm_config['vm_instance_uuid'] | default('')) | lower
                )
              )
            )
          )
          else
          (
            vm_info_current | combine({
              'item': export_vm_config,
              'failed': true,
              'msg': 'VirtuSphere VM identity mismatch'
            })
          )
        ]
      }}

# AN-07: the reason is part of the per-VM line, so a failed VM says why in the
# job log itself. Identity fields only; no module argument is ever printed.
- name: Grund dieser Exportabfrage fuer die Protokollzeile ermitteln
  ansible.builtin.set_fact:
    export_result_reason: >-
      {{
        ''
        if not ((vm_info_identity_results | last)['failed'] | default(false) | bool)
        else (
          ': query_failed after ' ~ vs_read_attempt ~ ' attempt(s): '
          ~ (vm_info_current['msg'] | default('no module message') | string | replace('\n', ' ') | truncate(300))
          if (vm_info_current['failed'] | default(false) | bool)
          else (
            ': identity mismatch, stored instance UUID '
            ~ ((export_vm_config['vm_instance_uuid'] | default('', true)) or 'none')
            ~ ', live instance UUID '
            ~ (((vm_info_current['instance'] | default({}))['instance_uuid'] | default('', true)) or 'none')
            ~ ', live VM name '
            ~ (((vm_info_current['instance'] | default({}))['hw_name'] | default('', true)) or 'none')
          )
        )
      }}

- name: Ergebnis dieser Exportabfrage melden
  ansible.builtin.debug:
    msg: "[{{ export_info_index + 1 }}/{{ vm_configurations | length }}]
      {{ 'fail' if (vm_info_identity_results | last)['failed'] | default(false) | bool else 'pass' }}
      Export info {{ export_vm_config['vm_name'] }}{{ export_result_reason }}"
