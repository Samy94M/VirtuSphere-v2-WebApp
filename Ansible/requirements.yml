---
# Complete Ansible collection lock for the VirtuSphere Ansible host (ADR-0025).
#
# This file is the single source of truth for direct and transitive collection
# versions. On a
# connected host install it directly:
#
#   ansible-galaxy collection install -r Ansible/requirements.yml
#
# Air-gapped hosts get both the collections AND the Python prerequisites
# (ansible-core/pyvmomi/requests as wheels, versions from the QA lock) from the
# offline bundle (scripts/build-offline-bundle.sh, collections/ and deps/wheels;
# steps in docs/operations/offline-install.md) - nothing needs the network
# beforehand anymore.
#
# community.vmware 6.2.0 is verified to carry every module the playbooks use,
# including community.vmware.vmware_host_auto_start (autostart policy) and
# community.vmware.vmware_about_info (capability diagnostics). It requires
# ansible-core >= 2.19 and pyVmomi >= 8.0.3.0.1 on the host, and supports
# vSphere/ESXi 7.0 and 8.0. See docs/DEPLOYMENT.md, "ESXi support matrix".
#
# `requests` is a hard requirement of every module below, not an optional extra:
# they all import community.vmware's vmware_rest_client, which raises "Failed to
# import the required Python library (requests)" before it looks at a single
# argument. Without it the inventory pull, the VM creation and the power playbooks
# all fail on a host that otherwise meets every documented prerequisite. See
# docs/DEPLOYMENT.md, "Required on the Ubuntu host".
#
# Two upstream facts belong to this pin. Both were read out of the artifact this
# file installs, not out of a release note, and the QA gate re-reads them
# (scripts/check.ps1, gate `ansible-module-contract`) so they cannot rot here:
#
#   2027-11  End of life of the community.vmware 6.x line. Release 6 is
#            maintained until then; unmaintained is release 4, not 6. For an
#            air-gapped LAN product that is a planning date, not a warning.
#
#   Of the community.vmware modules the playbooks call, exactly one is
#   deprecated in 6.2.0: vmware_guest_powerstate (removal in 7.0.0, successor
#   vmware.vmware.vm_powerstate), used by startVMs-ESXi_playbook.yml and
#   powercycleVMs-ESXi_playbook.yml. The successor ships in vmware.vmware 2.9.0.
#   community.vmware declares vmware.vmware >=2.5.0 as a dependency; pinning
#   2.9.0 explicitly below makes rebuilt QA images and offline bundles consume
#   the same bytes instead of whichever compatible release is newest that day.
#   Docker/qa-ansible/module-deprecations.txt is the checked-in list; a newly
#   deprecated module fails the gate instead of surfacing on a customer host.
collections:
  - name: community.vmware
    version: "6.2.0"
  - name: vmware.vmware
    version: "2.9.0"
