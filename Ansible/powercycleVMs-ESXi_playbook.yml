---
# Power-Cycle zur MAC-Erzeugung. ESXi vergibt einer NIC ihre MAC erst, wenn die
# VM einmal eingeschaltet war; der Lauf schaltet deshalb ein, wartet, schaltet
# hart aus (frisch erstellte VMs haben kein Guest-OS und keine VMware Tools,
# ein Soft-Shutdown wuerde haengen). Angefasst wird ausschliesslich, was dieser
# Lauf selbst von poweredOff nach poweredOn bewegt:
#   - Ziel ist nur eine VM, die needs_mac ausdruecklich bejaht; ohne das Feld
#     wird eine VM NICHT angefasst (kein default true mehr),
#   - vor jeder Aenderung erfasst vmware_guest_info den Ausgangszustand,
#   - eine bereits laufende oder suspendierte VM bleibt in ihrem Zustand: ihre
#     MACs existieren laengst, der Export liest sie ohne Zyklus,
#   - der always-Block schaltet die vom Lauf gestarteten VMs auch nach einem
#     Teilfehler zwischen Ein- und Ausschalten wieder aus; ein Fehler dabei
#     macht den Lauf fehlerhaft, nie zum Erfolg.
# Grenze: ein harter Prozessabbruch (Kill des ansible-Prozesses, SSH-Abriss)
# fuehrt keinen always-Block mehr aus und kann gestartete VMs eingeschaltet
# zuruecklassen; docs/DEPLOYMENT.md nennt das im Power-Cycle-Abschnitt.
- name: Power-Cycle der VMs zur MAC-Erzeugung
  hosts: localhost
  gather_facts: false
  vars_files:
    - ./serverlist.yml
    - ./accounts.yml

  tasks:
    # Beide Auswahl-Ketten sind zeichengleich in
    # Docker/qa-ansible/powercycle-selection-fixtures.yml gegen Fixtures
    # bewiesen (Gate ansible-powercycle-selection);
    # tests/Static/PowercyclePlaybookContractTest.php pinnt beide Dateien
    # aufeinander.
    - name: Ziele bestimmen (nur VMs, deren PXE-NIC laut Portal keine MAC hat)
      ansible.builtin.set_fact:
        powercycle_targets: "{{ vm_configurations | selectattr('needs_mac', 'defined') | selectattr('needs_mac') | list }}"

    - name: Ausgangszustand jeder Ziel-VM erfassen
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter_name }}"
        name: "{{ item.vm_name }}"
      delegate_to: localhost
      loop: "{{ powercycle_targets }}"
      register: powercycle_initial

    # Eine Antwort ohne Power-State darf nicht wie "nichts zu tun" aussehen:
    # die Auswahl unten bliebe leer, der Export saehe VMs ohne MAC, und kein
    # Fehler haette je einen Namen gehabt. Der Wachhund laeuft VOR der Auswahl
    # und ist selbst wurf-frei (map mit default deckt fehlendes instance und
    # fehlendes hw_power_status gleichermassen); die Auswahl-Kette darunter
    # setzt damit geprueften Stoff voraus, denn ein dotted-Filter wuerde auf
    # einer kaputten Antwortform werfen statt filtern (im Fixture-Playbook
    # bewiesen).
    - name: Jede Zustandsantwort muss den Power-State tragen
      ansible.builtin.assert:
        that:
          - powercycle_initial.results | default([]) | map(attribute='instance.hw_power_status', default='') | select('equalto', '') | list | length == 0
        fail_msg: >-
          vmware_guest_info hat fuer mindestens eine Ziel-VM keinen
          instance.hw_power_status geliefert; die Modulantwort passt nicht mehr
          zur Auswahl-Logik dieses Playbooks.
      when: powercycle_targets | length > 0

    - name: Nur initial ausgeschaltete Ziele werden geschaltet
      ansible.builtin.set_fact:
        powercycle_to_start: >-
          {{ powercycle_initial.results | default([])
             | selectattr('instance.hw_power_status', 'equalto', 'poweredOff')
             | map(attribute='item') | list }}

    - name: Power-Cycle mit Aufraeumgarantie
      when: powercycle_to_start | length > 0
      block:
        - name: VMs einschalten (nur initial ausgeschaltete ohne MAC)
          community.vmware.vmware_guest_powerstate:
            hostname: "{{ esxi_hostname }}"
            port: "{{ esxi_port | int }}"
            username: "{{ esxi_username }}"
            password: "{{ esxi_password }}"
            validate_certs: false
            name: "{{ item.vm_name }}"
            folder: "/"
            datacenter: "{{ item.datacenter_name }}"
            state: powered-on
            force: false
          delegate_to: localhost
          loop: "{{ powercycle_to_start }}"

        - name: Warten, bis ESXi die MACs vergibt
          ansible.builtin.pause:
            seconds: "{{ PowerCycleWaitSeconds | default(5) | int }}"
      always:
        # Hart (force true) und nur fuer die Liste, die dieser Lauf gestartet
        # hat: eine VM, die vor dem Lauf schon lief, steht hier nie drin. Ein
        # Fehler in diesem Aufraeumen laesst den Lauf fehlschlagen.
        - name: Vom Lauf gestartete VMs wieder hart ausschalten
          community.vmware.vmware_guest_powerstate:
            hostname: "{{ esxi_hostname }}"
            port: "{{ esxi_port | int }}"
            username: "{{ esxi_username }}"
            password: "{{ esxi_password }}"
            validate_certs: false
            name: "{{ item.vm_name }}"
            folder: "/"
            datacenter: "{{ item.datacenter_name }}"
            state: powered-off
            force: true
          delegate_to: localhost
          loop: "{{ powercycle_to_start }}"
