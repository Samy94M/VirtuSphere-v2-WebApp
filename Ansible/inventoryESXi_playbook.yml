---
# Read-only ESXi/vCenter inventory (ADR-0023). Uses only community.vmware
# *_info / *_facts modules; it never changes anything on the host. The worker
# parses the single base64-JSON marker line at the end (VirtuSphere_inventory).
#
# Field paths follow the documented community.vmware module outputs; they are
# verified against the productive host on first rollout (see docs/operations/
# esxi-inventory.md). Everything is guarded with default() so a missing section
# yields an empty list rather than failing the whole run.
- name: VirtuSphere ESXi inventory (read-only)
  hosts: localhost
  gather_facts: false
  vars_files:
    - ./accounts.yml

  tasks:
    # Connection canary: NO ignore_errors, so a connection/auth/authz failure
    # fails the run with a categorizable message (the worker classifies it).
    - name: Gather datacenters
      community.vmware.vmware_datacenter_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
      register: vs_datacenters

    - name: Gather datastores
      community.vmware.vmware_datastore_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
      register: vs_datastores
      ignore_errors: true

    # `esxi_hostname` is not optional decoration: the module's argument spec
    # requires one of cluster_name/esxi_hostname and rejects the call before it
    # opens a connection ("one of the following is required: cluster_name,
    # esxi_hostname"). Without it the task failed against every endpoint,
    # ignore_errors swallowed the failure, and the portal reported 0 portgroups
    # for a host that had thirteen. On a direct ESXi connection the value is not
    # matched against anything (the module takes the one host it is talking to),
    # so the connection address satisfies the contract. Against a vCenter it
    # would have to name the host OBJECT, which an inventory pull does not know
    # yet; standard portgroups stay empty there, as the host facts do.
    - name: Gather standard portgroups
      community.vmware.vmware_portgroup_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        esxi_hostname: "{{ esxi_hostname }}"
      register: vs_portgroups
      ignore_errors: true

    # Distributed portgroups exist only under a vCenter; a standalone ESXi host
    # has none. Omitting `datacenter` was meant to let the task fail in a
    # controlled way there, but the module requires the argument, so the call
    # was rejected on EVERY endpoint, vCenter included ("missing required
    # arguments: datacenter"). It now takes the first datacenter the canary
    # above reported and is skipped when there is none, instead of guessing a
    # name. `show_vlan_info` is what puts the VLAN id into the result at all;
    # DVS objects nest it under `vlan_info` while standard portgroups carry
    # `vlan_id` at the top level (both shapes resolve in
    # ansible_inventory_network_item()). Unverified against a real DVS: a
    # vCenter holding several datacenters would need a loop over all of them.
    - name: Gather distributed portgroups
      community.vmware.vmware_dvs_portgroup_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ vs_datacenters.datacenter_info | map(attribute='name') | first }}"
        show_vlan_info: true
      register: vs_dvs_portgroups
      when: (vs_datacenters.datacenter_info | default([])) | length > 0
      ignore_errors: true

    - name: Gather host facts
      community.vmware.vmware_host_facts:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
      register: vs_hosts
      ignore_errors: true

    # The deployment collision gate needs every occupied VM name, its MOID and
    # durable instance UUID. The pinned vmware_vm_info exposes both `uuid`
    # (product UUID) and `instance_uuid`; PHP deliberately keeps only the latter.
    - name: Gather virtual machines for collision detection
      community.vmware.vmware_vm_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
      register: vs_vms
      ignore_errors: true

    # Capability facts (ADR-0023 amendment 3). Read-only, like everything else
    # here. about_info answers what the endpoint IS (standalone host or vCenter,
    # product, licence); the vsphere schema answers what it is DOING (maintenance
    # mode, HA cluster membership). Both are properties of a SUCCESSFUL pull, not
    # error categories. A failing task leaves its key absent and the PHP parser
    # reads that as "not known", never as false.
    - name: Gather about info (api type, product, license)
      community.vmware.vmware_about_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
      register: vs_about
      ignore_errors: true

    - name: Gather host runtime (maintenance mode, HA state)
      community.vmware.vmware_host_facts:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        schema: vsphere
        properties:
          - runtime.inMaintenanceMode
          - runtime.dasHostState
      register: vs_host_runtime
      ignore_errors: true

    - name: Assemble inventory result
      ansible.builtin.set_fact:
        vs_inventory:
          fetched_epoch: "{{ ansible_date_time.epoch | default(lookup('pipe', 'date +%s')) }}"
          datacenters: >-
            {{ (vs_datacenters.datacenter_info | default([])) | map(attribute='name') | list }}
          datastores: >-
            {{ (vs_datastores.datastores | default([])) | map('combine', {}) | list }}
          # Raw portgroup objects, deliberately unprojected: the PHP parser
          # extracts name and vlan_id (ansible_inventory_network_item), because
          # PHP is unit-testable without an ESXi host while Jinja is not.
          networks_standard: >-
            {{ (vs_portgroups.hosts_portgroup_info | default({})) | dict2items
               | map(attribute='value') | flatten | list }}
          networks_dvs: >-
            {{ (vs_dvs_portgroups.dvs_portgroup_info | default({})) | dict2items
               | map(attribute='value') | flatten | list }}
          hosts: >-
            {{ vs_hosts.ansible_facts | default({}) }}
          # Raw pass-through: PHP keeps name/MOID/power state and counts any
          # entry it cannot normalize, just like the network inventory.
          vms: >-
            {{ vs_vms.virtual_machines | default([]) }}
          # Raw pass-through, for the same reason as the portgroups above: the
          # field extraction lives in ansible_parse_inventory_capabilities().
          about: >-
            {{ vs_about.about_info | default({}) }}
          host_runtime: >-
            {{ vs_host_runtime.ansible_facts | default({}) }}
          # What each single query did. Without this an empty list is three
          # different things at once: the host really has none, the account may
          # not look, or the call was rejected before it ever reached ESXi. The
          # last one is how a missing module argument stayed invisible for
          # months behind ignore_errors, so the pull now says which of its
          # queries answered instead of leaving a 0 to be interpreted.
          # Deliberately projected to three fields rather than forwarding the
          # registered results whole: those carry `invocation` with every module
          # argument, and the ESXi password has no business in a job log.
          # `msg` itself is safe to forward: ansible-core runs remove_values()
          # over every module result, so a no_log value (the password argument)
          # cannot survive inside a message. The projection guards the fields
          # that are not messages, which no scrub protects.
          queries: >-
            {{ {
              'datacenters': {'failed': vs_datacenters.failed | default(false),
                              'skipped': vs_datacenters.skipped | default(false),
                              'msg': vs_datacenters.msg | default('')},
              'datastores': {'failed': vs_datastores.failed | default(false),
                             'skipped': vs_datastores.skipped | default(false),
                             'msg': vs_datastores.msg | default('')},
              'networks_standard': {'failed': vs_portgroups.failed | default(false),
                                    'skipped': vs_portgroups.skipped | default(false),
                                    'msg': vs_portgroups.msg | default('')},
              'networks_dvs': {'failed': vs_dvs_portgroups.failed | default(false),
                               'skipped': vs_dvs_portgroups.skipped | default(false),
                               'msg': vs_dvs_portgroups.msg | default('')},
              'hosts': {'failed': vs_hosts.failed | default(false),
                        'skipped': vs_hosts.skipped | default(false),
                        'msg': vs_hosts.msg | default('')},
              'vms': {'failed': vs_vms.failed | default(false),
                      'skipped': vs_vms.skipped | default(false),
                      'msg': vs_vms.msg | default('')},
              'about': {'failed': vs_about.failed | default(false),
                        'skipped': vs_about.skipped | default(false),
                        'msg': vs_about.msg | default('')},
              'host_runtime': {'failed': vs_host_runtime.failed | default(false),
                               'skipped': vs_host_runtime.skipped | default(false),
                               'msg': vs_host_runtime.msg | default('')}
            } }}

    - name: Emit inventory marker (base64 JSON for robust parsing)
      ansible.builtin.debug:
        msg: "VIRTUSPHERE_INVENTORY_B64_BEGIN{{ vs_inventory | to_json | b64encode }}VIRTUSPHERE_INVENTORY_B64_END"
