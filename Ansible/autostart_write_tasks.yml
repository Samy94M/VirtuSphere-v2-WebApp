---
# Schreibt einen Autostart-Eintrag des Hosts, mit Wiederholung (K4a, W1).
#
# Eingebunden aus autostartVMs-ESXi_playbook.yml, einmal fuer die
# Standardwerte des Hosts (Stufe 1) und je VM (Stufe 2). Beide Aufrufe
# schreiben einen Soll-Zustand: derselbe Eintrag ein zweites Mal geschrieben
# aendert nichts. Deshalb darf ein Fehlschlag (etwa HTTP 503) bis zu dreimal
# wiederholt werden, mit den Pausen aus esxi_retry_wait_tasks.yml.
#
# Erwartet:
#   autostart_vm         Eintrag aus der Identitaetsabfrage (instance, item)
#                        fuer Stufe 2; nicht gesetzt fuer Stufe 1
#   autostart_position   "[n/total]" der Einheit
#   autostart_unit       Einheit, etwa "Autostart vm02"
# Setzt:
#   autostart_write_result   Ergebnis des letzten Versuchs
#   autostart_write_attempt  Zahl der Versuche
#
# Die Fortschrittszeilen (`RUN`, danach `pass|fail`) stehen nur auf der
# aeussersten Ebene; die Wiederholungen binden dieselbe Datei mit
# autostart_write_is_retry ein. Die Datei bricht nie ab: ein endgueltig
# gescheiterter VM-Eintrag landet in autostart_failures, und das Playbook
# entscheidet nach der letzten VM.
- name: Beginn des Autostart-Eintrags melden
  ansible.builtin.debug:
    msg: "{{ autostart_position }} RUN {{ autostart_unit }}"
  when: not (autostart_write_is_retry | default(false) | bool)

- name: Ersten Schreibversuch zaehlen
  ansible.builtin.set_fact:
    autostart_write_attempt: 1
  when: not (autostart_write_is_retry | default(false) | bool)

# Stufe 1 setzt system_defaults, Stufe 2 power_info fuer genau eine VM; der
# jeweils andere Teil faellt weg (omit). start_order bleibt -1
# (community.vmware#1903, siehe Playbook).
- name: Autostart-Eintrag schreiben
  community.vmware.vmware_host_auto_start:
    hostname: "{{ esxi_hostname }}"
    port: "{{ esxi_port | int }}"
    username: "{{ esxi_username }}"
    password: "{{ esxi_password }}"
    validate_certs: "{{ esxi_validate_certs | bool }}"
    esxi_hostname: "{{ vs_esxi_host }}"
    system_defaults: >-
      {{
        {
          'enabled': true,
          'start_delay': mission_configuration.autostart.start_delay | int,
          'stop_delay': mission_configuration.autostart.stop_delay | int,
          'stop_action': mission_configuration.autostart.stop_action,
          'wait_for_heartbeat': mission_configuration.autostart.wait_for_heartbeat | bool
        } if autostart_vm is not defined else omit
      }}
    uuid: "{{ (autostart_vm['instance'] | default({}))['instance_uuid'] if autostart_vm is defined else omit }}"
    use_instance_uuid: "{{ true if autostart_vm is defined else omit }}"
    power_info: >-
      {{
        {
          'start_action': 'powerOn' if (autostart_vm.item.autostart.enabled | bool) else 'none',
          'start_order': -1,
          'start_delay': autostart_vm.item.autostart.start_delay | int,
          'stop_delay': autostart_vm.item.autostart.stop_delay | int,
          'stop_action': 'systemDefault',
          'wait_for_heartbeat': 'systemDefault'
        } if autostart_vm is defined else omit
      }}
  delegate_to: localhost
  register: autostart_write_result
  # Toleriert bis zum letzten Versuch; danach entscheidet der Aufrufer.
  ignore_errors: true

- name: Naechsten Schreibversuch entscheiden
  ansible.builtin.set_fact:
    autostart_write_again: >-
      {{
        (autostart_write_result['failed'] | default(false) | bool)
        and (autostart_write_attempt | int) <= ((EsxiRetryPauseSeconds | default([5, 15, 45])) | length)
      }}

- name: Vor dem naechsten Schreibversuch warten
  ansible.builtin.include_tasks: ./esxi_retry_wait_tasks.yml
  vars:
    vs_retry_position: "{{ autostart_position }}"
    vs_retry_unit: "{{ autostart_unit }}"
    vs_retry_attempt: "{{ autostart_write_attempt }}"
    vs_retry_cause: "{{ autostart_write_result['msg'] | default('') }}"
  when: autostart_write_again | bool

- name: Schreibversuch hochzaehlen
  ansible.builtin.set_fact:
    autostart_write_attempt: "{{ autostart_write_attempt | int + 1 }}"
  when: autostart_write_again | bool

- name: Autostart-Eintrag erneut schreiben
  ansible.builtin.include_tasks: ./autostart_write_tasks.yml
  vars:
    autostart_write_is_retry: true
  when: autostart_write_again | bool

# Gezaehlt wird, was nachweislich geschrieben ist; die Markerzeile des
# Playbooks meldet diese Zahl auch nach einem Abbruch mitten in der Schleife.
- name: Geschriebenen VM-Eintrag zaehlen
  ansible.builtin.set_fact:
    autostart_written: "{{ autostart_written | int + 1 }}"
  when:
    - not (autostart_write_is_retry | default(false) | bool)
    - autostart_vm is defined
    - not (autostart_write_result['failed'] | default(false) | bool)

- name: Endgueltig nicht geschriebenen VM-Eintrag sammeln
  ansible.builtin.set_fact:
    autostart_failures: >-
      {{
        autostart_failures
        + [autostart_vm['item']['vm_name'] ~ ' after ' ~ autostart_write_attempt ~ ' attempt(s): '
           ~ (autostart_write_result['msg'] | default('no module message') | string | replace('\n', ' ') | truncate(300))]
      }}
  when:
    - not (autostart_write_is_retry | default(false) | bool)
    - autostart_vm is defined
    - autostart_write_result['failed'] | default(false) | bool

- name: Ergebnis des Autostart-Eintrags melden
  ansible.builtin.debug:
    msg: >-
      {{ autostart_position }}
      {{ 'fail' if autostart_write_result['failed'] | default(false) | bool else 'pass' }}
      {{ autostart_unit }}{{
        (': ' ~ (autostart_write_result['msg'] | default('no module message') | string | replace('\n', ' ') | truncate(300)))
        if (autostart_write_result['failed'] | default(false) | bool) else ''
      }}
  when: not (autostart_write_is_retry | default(false) | bool)
