---
- name: Sammle Informationen aller VMs
  hosts: localhost
  gather_facts: false
  vars_files:
    - ./serverlist.yml
    - ./accounts.yml
  environment:
    SSL_CERT_FILE: "{{ esxi_ca_bundle_path }}"
    REQUESTS_CA_BUNDLE: "{{ esxi_ca_bundle_path }}"

  tasks:
    - name: Sammle VM-Informationen
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        port: "{{ esxi_port | int }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ esxi_validate_certs | bool }}"
        datacenter: "{{ item.datacenter_name }}"
        name: "{{ item.vm_name }}"
      delegate_to: localhost
      loop: "{{ vm_configurations }}"
      register: vm_info
      # A missing/unreachable VM is a per-VM MAC result, not a reason to hide
      # every other VM result. ignore_errors keeps the failed item (including
      # item/failed/msg) in vm_info.results for db_importMAC.php to classify.
      ignore_errors: true

    # Keep the export's per-VM result contract: a query failure stays a failure,
    # while a successful reply about a namesake is converted into one before the
    # callback can write MACs or lifecycle state. In a full pipeline an empty
    # stored UUID is allowed because create in the same sequence just proved the
    # name absent; the callback binds the returned UUID atomically.
    - name: Name und Instance-UUID je Export-Ergebnis validieren
      ansible.builtin.set_fact:
        vm_info_identity_results: >-
          {{
            (vm_info_identity_results | default([]))
            +
            [
              item
              if
              (
                item['failed'] | default(false) | bool
                or
                (
                  ((item['instance'] | default({}))['hw_name'] | default(''))
                  == ((item['item'] | default({}))['vm_name'] | default(''))
                  and
                  (
                    (identity_unbound_allowed | default(false) | bool)
                    or
                    (
                      ((item['item'] | default({}))['vm_instance_uuid'] | default('')) | trim | length > 0
                      and
                      ((item['instance'] | default({}))['instance_uuid'] | default('')) | lower
                      == ((item['item'] | default({}))['vm_instance_uuid'] | default('')) | lower
                    )
                  )
                )
              )
              else
              (
                item | combine({
                  'failed': true,
                  'msg': 'VirtuSphere VM identity mismatch'
                })
              )
            ]
          }}
      loop: "{{ vm_info.results | default([]) }}"
      loop_control:
        label: "{{ (item['item'] | default({}))['vm_name'] | default('unknown') }}"

    - name: Speichere gesammelte Informationen in einer temporaeren Datei
      ansible.builtin.copy:
        dest: "./vm_infos.json"
        content: "{{ vm_info_identity_results | to_nice_json }}"
        # Nur der Ansible-Benutzer liest die Datei (upload_mac_list.py im selben
        # Arbeitsverzeichnis); VM-Namen/MACs gehen niemanden sonst etwas an.
        mode: "0600"

    - name: Fuehre Python-Skript aus, um Daten zu verarbeiten und in CSV umzuwandeln
      ansible.builtin.command: python3 ./upload_mac_list.py
      delegate_to: localhost
      register: mac_upload
      # The upload always mutates server state when it succeeds (MACs, job
      # result); there is no read-only pass to detect.
      changed_when: true
      # rc=20 is a durable partial result in deploy_jobs.result_json. All other
      # non-zero codes mean the callback itself was not safely completed.
      failed_when: mac_upload.rc not in [0, 20]
