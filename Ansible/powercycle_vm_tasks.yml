---
- name: Beginn des VM-Zyklus melden
  ansible.builtin.debug:
    msg: "[{{ powercycle_index + 1 }}/{{ powercycle_to_start | length }}] RUN Powercycle {{ powercycle_vm['item']['vm_name'] }}"

- name: Einen vollstaendigen VM-Zyklus ausfuehren
  block:
    - name: Bestaetigte eigene Starts leer initialisieren
      ansible.builtin.set_fact:
        powercycle_started_by_run: []

    - name: Power-Cycle mit Aufraeumgarantie
      when: powercycle_vm is defined
      block:
        # W2: ein unklares Einschalten wird nie blind wiederholt. Die Datei
        # liest nach jedem Fehlschlag den Zustand und meldet als `started`
        # auch eine VM, die nur die Antwort verloren hat.
        - name: VM einschalten und unklare Antworten nachlesen
          ansible.builtin.include_tasks: ./powercycle_power_on_tasks.yml

        - name: Nur nachweislich eigene Einschaltungen fuer Cleanup erfassen
          ansible.builtin.set_fact:
            powercycle_started_by_run: "{{ [powercycle_vm] }}"
          when: powercycle_on_outcome | default('') == 'started'

        - name: Warten, bis ESXi die MACs vergibt
          ansible.builtin.pause:
            seconds: "{{ PowerCycleWaitSeconds | default(5) | int }}"
          when: powercycle_started_by_run | length > 0
      always:
        # Hart (force true) und nur fuer die VM, die dieser Lauf nachweislich
        # gestartet hat: eine VM, die vor dem Lauf schon lief, steht hier nie
        # drin. Ein endgueltiger Fehler dabei laesst den Lauf fehlschlagen.
        - name: Vom Lauf gestartete VM wieder hart ausschalten
          ansible.builtin.include_tasks: ./powercycle_power_off_tasks.yml
          when: powercycle_started_by_run | default([]) | length > 0

    - name: Mehrdeutige oder fehlgeschlagene Einschaltungen hart melden
      ansible.builtin.assert:
        that:
          - powercycle_on_outcome | default('unknown') in ['started', 'external']
        fail_msg: >-
          {{ powercycle_on_cause | default('power-on outcome unknown') }}.
          Nur nachweislich von diesem Lauf eingeschaltete VMs wurden wieder
          ausgeschaltet; ist der Zustand unbekannt, kann die VM noch laufen.
      when: powercycle_vm is defined

    - name: Abgeschlossenen VM-Zyklus melden
      ansible.builtin.debug:
        msg: "[{{ powercycle_index + 1 }}/{{ powercycle_to_start | length }}] pass Powercycle {{ powercycle_vm['item']['vm_name'] }}"
  rescue:
    # Die Meldung des gescheiterten Tasks (Einschalten, Zustandsabfrage oder
    # Ausschalten) steht im Text und wird so die Ursache des Auftrags.
    - name: Fehlgeschlagenen VM-Zyklus melden und vor der naechsten VM abbrechen
      ansible.builtin.fail:
        msg: >-
          [{{ powercycle_index + 1 }}/{{ powercycle_to_start | length }}] fail Powercycle
          {{ powercycle_vm['item']['vm_name'] }} ({{ powercycle_vm['instance']['instance_uuid'] }}):
          {{ (ansible_failed_result | default({}))['msg'] | default('no message') | string | replace('\n', ' ') | truncate(600) }}
          Zustand dieser UUID im ESXi Host Client pruefen. Keine weitere VM wird gestartet.
