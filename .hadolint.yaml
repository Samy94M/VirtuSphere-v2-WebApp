  # zeitvariabel, die Basis ist per Digest fixiert; echte Byte-Gleichheit
  # liefert das Offline-Bundle (docker save der gebauten Images).
  - DL3008
  # DL3018: apk-Paketversionen pinnen; dieselbe Abwaegung wie DL3008 fuer
