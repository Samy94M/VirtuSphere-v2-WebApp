# Secret-Scan-Vertrag (Etappe 7, AP7 Security). Der Scan laeuft ueber die VOLLE
# Git-Historie (Release-Lane-Gate `secret-scan` in scripts/check.ps1); erwartet
# werden null Funde. Jeder Allowlist-Eintrag ist eine dokumentierte
# Entscheidung, kein Komfort:
#
# Bekannte HISTORISCHE Leaks, die die Historie behaelt (git rm entfernt keine
# Vergangenheit) und die deshalb hier abgeschlossen werden, statt jeden Lauf
# neu aufzuschrecken:
#   - functions.psm1 (Initial-Commit): Klartext-MySQL-Passwort. gitleaks'
#     Regeln matchen es nicht, ein Eintrag ist nicht noetig; die Rotation des
#     Kontos ist als Go-live-Schritt in docs/operations/go-live.md verbucht.
#   - Docker/nginx/ssl/nginx-selfsigned.key (Commit 7dbefa78, in HEAD
#     geloescht): ein selbstsignierter Dev-Schluessel aus der Zeit vor dem
#     Admin-Upload-Flow (ADR-0027). Nie ein Produktionszertifikat; das
#     Zertifikat des Zielsystems wird ueber den Portal-Upload frisch
#     installiert und teilt dieses Schluesselmaterial nicht.

[extend]
useDefault = true

# Globale Eintraege fuer alle Regeln (ohne targetRules; condition OR wie beim
# frueheren [allowlist], das gitleaks neben [[allowlists]] nicht mehr laedt).
[[allowlists]]
description = "dokumentierte Test-Fixtures, Vendor-Format-Templates und der historische Dev-Key"
paths = [
    # HTTPS-Test-Fixtures: absichtlich eingecheckte Wegwerf-Schluessel, die nur
    # der Upload-Parser-Test laedt. .txt-Endung, damit kein Deploy-Tooling sie
    # je als echtes Material einsammelt.
    '''Docker/WebAPI/tests/fixtures/https/.*\.key\.txt''',
    # LDAP-Hermetik-Fixtures (Docker/ldap-fixture): dieselbe Konvention, siehe
    # Docker/WebAPI/tests/fixtures/ldap/README.md.
    '''Docker/WebAPI/tests/fixtures/ldap/.*\.key\.txt''',
    # phpseclib traegt PEM-Header als Format-Templates im Bibliothekscode.
    '''Docker/WebAPI/vendor/phpseclib/.*''',
    # Historischer Dev-Self-Signed-Key, siehe Kopfkommentar.
    '''Docker/nginx/ssl/nginx-selfsigned\.key''',
]
# Literale, die die Default-Regeln als Secret deuten, obwohl sie ein eng
# begrenztes Testwort oder technische Dokumentationsprosa sind. Der zweite
# Eintrag ist der historische Changelog-Begriff aus Commit 0381eedd; die
# generic-api-key-Regel liest ihn nach "Machine-API-Wire," als Schluesselwert.
stopwords = [
    "Rbac-Smuggle",
    "ADR-0018-Semantik",
]

# Erfundene Testwerte in Redaktionstests (Release 2026.10.1, Befund S1). Jeder
# Eintrag gilt nur fuer eine Regel, nur fuer genau die genannten Dateien und nur
# fuer genau den Testwert (condition AND): ein echtes Secret in derselben Datei
# oder derselbe Wert in einer anderen Datei bleibt ein Fund.
#
# LogRedactionTest (Commit 6090ddfc, AL-2) prueft, dass ein PEM-Block im Log
# geschwaerzt wird. Der "Schluessel" ist ein abgeschnittener Kopf plus die
# PHP-Verkettung mit dem Testgeheimnis ($s), kein Schluesselmaterial.
[[allowlists]]
description = "PEM-Attrappe im Redaktionstest (S1)"
targetRules = ["private-key"]
condition = "AND"
paths = ['''^Docker/WebAPI/tests/Unit/LogRedactionTest\.php$''']
regexes = ['''MIIEpAIBAAKCAQEA" \. \$s \. "''']

# Die beiden Deploy-Tests (Commit 2cc528c7) setzen ein erfundenes ESXi-Passwort
# und pruefen, dass es in keinem gespeicherten Fehlertext ueberlebt.
[[allowlists]]
description = "erfundenes ESXi-Passwort in Deploy-Redaktionstests (S1)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
    '''^Docker/WebAPI/tests/Integration/DeployCreateErrorDetailRedactionTest\.php$''',
    '''^Docker/WebAPI/tests/Unit/DeployWorkerStepFailureTest\.php$''',
]
regexes = ['''^Esxi-Secret-4711$''']
